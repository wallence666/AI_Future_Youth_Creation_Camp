<!DOCTYPE html>
<html lang="zh-Hant" class="sub-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fcfdfd">
<meta name="robots" content="noindex">
<title>管理後台 · 澳行無阻</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23E5B04E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230A1327'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app-v2.css">
</head>
<body class="sub-page">

<header class="sub-header">
  <div class="brand"><i></i><span>澳行無阻 · 管理後台</span></div>
  <div class="sub-actions">
    <a class="btn btn-ghost btn-sm" href="/app/">← 返回地圖</a>
    <span class="sub-user" id="userChip" hidden></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>登出</button>
  </div>
</header>

<!-- 登入卡 -->
<div class="page-wrap" id="loginView">
  <div class="card login-card">
    <h2>管理員登入</h2>
    <p class="card-tip">商家審核 · 活動審核 · 店舖與評論管理 · 數據概覽</p>
    <div class="auth-field"><label>用戶名</label><input id="loginUser" autocomplete="username"></div>
    <div class="auth-field"><label>密碼</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div class="auth-err" id="loginErr" hidden></div>
    <button class="btn-gold modal-ok" id="loginBtn">登入</button>
  </div>
</div>

<!-- 主界面 -->
<div class="page-wrap" id="mainView" hidden>
  <div class="stats-grid" id="statsGrid"></div>

  <div class="adm-tabs" id="admTabs">
    <button data-tab="merchants" class="on">待審商家 <b class="tab-badge" id="badgeMerchants" hidden></b></button>
    <button data-tab="promos">待審活動 <b class="tab-badge" id="badgePromos" hidden></b></button>
    <button data-tab="shops">店舖管理</button>
    <button data-tab="comments">評論管理</button>
  </div>

  <div id="admList" class="adm-list"><div class="me-empty">載入中…</div></div>
  <p class="page-foot">澳行無阻 · 灣區 AI 未來青年創造營參賽作品</p>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/core/config.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/pwa.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/pages/admin.js"></script>
</body>
</html>
